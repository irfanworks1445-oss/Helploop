<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpLoop - My Tools</title>
    <link rel="stylesheet" href="my-tools.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <img src="nav-logo.png" alt="HelpLoop" class="nav-logo">
        </div>

        <nav class="nav-pill">
            <a href="home.html" class="nav-item">Home</a>
            <a href="task.html" class="nav-item">Tasks</a>
            <a href="tool.html" class="nav-item active">Tools</a>
            <a href="messages.html" class="nav-item">Messages</a>
            <a href="profile.html" class="nav-item">Profile</a>
        </nav>

        <div class="location-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10z"/>
                <circle cx="12" cy="11" r="2.2"/>
                <path d="M7 21h10"/>
            </svg>
            <span>Kochi,Kerala</span>
        </div>
    </header>

    <!-- Main My Tools Content -->
    <main class="container">
        <h1 class="page-title">My Tools</h1>

        <!-- 2x2 Tools Grid -->
        <section class="tools-grid">

            <!-- Card 1: Drill Machine -->
            <div class="tool-card">
                <img src="drill.png" alt="Drill Machine" class="tool-img">

                <div class="tool-info">
                    <h2>Drill Machine</h2>
                    <p class="tool-model">Bosch GSB 600</p>
                    <strong class="tool-rate">&#8377;150 /day</strong>
                    <span class="tool-dist">2Km</span>
                </div>
            </div>

            <!-- Card 2: Bosch Toolkit -->
            <div class="tool-card">
                <img src="tool kit.png" alt="Bosch Toolkit" class="tool-img">

                <div class="tool-info">
                    <h2>Bosch Toolkit</h2>
                    <p class="tool-model">L046 46pc</p>
                    <strong class="tool-rate">&#8377;150 /day</strong>
                    <span class="tool-dist">7Km</span>
                </div>
            </div>

            <!-- Card 3: Angle Grinder -->
            <div class="tool-card">
                <img src="grinder.png" alt="Angle Grinder" class="tool-img">

                <div class="tool-info">
                    <h2>Angle Grinder</h2>
                    <p class="tool-model">Makita 9553B</p>
                    <strong class="tool-rate">&#8377;120 /day</strong>
                    <span class="tool-dist">2.4Km</span>
                </div>
            </div>

            <!-- Card 4: Welding Machine -->
            <div class="tool-card">
                <img src="welding.png" alt="Welding Machine" class="tool-img">

                <div class="tool-info">
                    <h2>Welding Machie</h2>
                    <p class="tool-model">Toshon ZX7</p>
                    <strong class="tool-rate">&#8377;250 /day</strong>
                    <span class="tool-dist">1Km</span>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
