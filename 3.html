<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpLoop - Login</title>
    <link rel="stylesheet" href="3.css">
</head>
<body>

    <div class="auth-wrapper">
        
        <!-- Left Column: Brand + Google Button -->
        <div class="left-column">
            <img src="Group 654.png" alt="HelpLoop - People, Tools, Tasks" class="logo-image">

            <p class="subtitle">
                A Stronger Neighbourhood<br>
                Start Here
            </p>

            <a href="home.html" class="google-btn">
                <img src="icons8-google-48.png" alt="Google" class="google-icon">
                <span>Continue Using Google</span>
            </a>
        </div>

        <!-- Right Column: Login Form -->
        <div class="right-column">
            <h2 class="form-title">Login</h2>

            <form action="home.html" method="GET" class="auth-form">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>

                <a href="home.html" class="primary-btn">Login</a>
            </form>

            <p class="switch-text">
                Don't have an account? <a href="2.html" class="switch-link">SignUp</a>
            </p>
        </div>

    </div>

</body>
</html>
