<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpLoop - Payment</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <img src="nav-logo.png" alt="HelpLoop" class="nav-logo">
        </div>

        <nav class="nav-pill">
            <a href="home.html" class="nav-item">Home</a>
            <a href="tasks.html" class="nav-item">Tasks</a>
            <a href="tools.html" class="nav-item active">Tools</a>
            <a href="messages.html" class="nav-item">Messages</a>
            <a href="profile.html" class="nav-item">Profile</a>
        </nav>

        <div class="location-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10z"/>
                <circle cx="12" cy="11" r="2.2"/>
                <path d="M7 21h10"/>
            </svg>
            <span>Kochi,Kerala</span>
        </div>
    </header>

    <!-- Main Payment Content -->
    <main class="container">

        <section class="payment-grid">

            <!-- Left Column: Task Card + Payment Summary -->
            <div class="left-col">

                <!-- Task Info Card -->
                <div class="info-card">
                    <img src="tv.png" alt="TV Wall Mount Installation" class="task-thumb">

                    <div class="task-details">
                        <div class="task-top">
                            <h2>TV Wall Mount Installation</h2>
                            <span class="assigned-pill">Assigned</span>
                        </div>

                        <div class="detail-row">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0c292d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 10.5L12 3l9 7.5"/>
                                <path d="M5 9.5V20h5v-5h4v5h5V9.5"/>
                            </svg>
                            <span>Home Repair</span>
                        </div>

                        <div class="detail-inline">
                            <div class="detail-row">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0c292d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                                <span>12 Nov 2026</span>
                            </div>

                            <div class="detail-row">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0c292d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9"/>
                                    <polyline points="12 7 12 12 15.5 14"/>
                                </svg>
                                <span>4:00 Pm</span>
                            </div>
                        </div>

                        <div class="detail-row">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0c292d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10z"/>
                                <circle cx="12" cy="11" r="2.2"/>
                                <path d="M7 21h10"/>
                            </svg>
                            <span>Kakanad, Kochi, Kerala</span>
                        </div>
                    </div>
                </div>

                <!-- Payment Summary Card -->
                <div class="summary-card">
                    <h3>Payment Summary</h3>

                    <div class="summary-line">
                        <span>Agreed Price</span>
                        <span>&#8377;400</span>
                    </div>

                    <div class="summary-line fee-line">
                        <span class="fee-label">
                            Platform Fee
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0c292d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="9"/>
                                <line x1="12" y1="11" x2="12" y2="16"/>
                                <circle cx="12" cy="8" r="0.8" fill="#0c292d"/>
                            </svg>
                        </span>
                        <span>&#8377;30</span>
                    </div>

                    <div class="summary-total">
                        <span>Total Payable</span>
                        <span class="total-amount">&#8377;430</span>
                    </div>
                </div>

            </div>

            <!-- Right Column: Choose Payment Method -->
            <div class="right-col">
                <div class="method-card">
                    <h3>Choose Payment Method</h3>

                    <div class="method-list">
                        <!-- UPI -->
                        <label class="method-option selected">
                            <input type="radio" name="payment_method" value="upi" checked>
                            <div class="method-icon upi-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1ba664" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="6 6 12 12 6 18"/>
                                    <polyline points="12 6 18 12 12 18"/>
                                </svg>
                            </div>
                            <div class="method-text">
                                <h4>UPI</h4>
                                <p>Pay using any UPI app (GPay, PhonePe, etc.)</p>
                            </div>
                            <span class="radio-dot"></span>
                        </label>

                        <!-- Debit / Credit Card -->
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="card">
                            <div class="method-icon card-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f75fe" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="5" width="20" height="14" rx="2.5"/>
                                    <line x1="2" y1="10" x2="22" y2="10"/>
                                </svg>
                            </div>
                            <div class="method-text">
                                <h4>Debit / Credit Card</h4>
                                <p>Visa, Mastercard, RuPay</p>
                            </div>
                            <span class="radio-dot"></span>
                        </label>

                        <!-- Net Banking -->
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="netbanking">
                            <div class="method-icon bank-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1ba664" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 9l9-5 9 5"/>
                                    <line x1="5" y1="10" x2="5" y2="17"/>
                                    <line x1="9.5" y1="10" x2="9.5" y2="17"/>
                                    <line x1="14.5" y1="10" x2="14.5" y2="17"/>
                                    <line x1="19" y1="10" x2="19" y2="17"/>
                                    <line x1="3" y1="18" x2="21" y2="18"/>
                                </svg>
                            </div>
                            <div class="method-text">
                                <h4>Net Banking</h4>
                                <p>All major banks supported</p>
                            </div>
                            <span class="radio-dot"></span>
                        </label>

                        <!-- HELPLOOP Wallet -->
                        <label class="method-option">
                            <input type="radio" name="payment_method" value="wallet">
                            <div class="method-icon wallet-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1ba664" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="6" width="18" height="13" rx="2.5"/>
                                    <path d="M16 12.5h5v3h-5a1.5 1.5 0 0 1 0-3z"/>
                                </svg>
                            </div>
                            <div class="method-text">
                                <h4>HELPLOOP Wallet</h4>
                                <p>Balance: &#8377;2,450</p>
                            </div>
                            <span class="radio-dot"></span>
                        </label>
                    </div>

                    <div class="secure-note">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1ba664" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <polyline points="9 12 11 14 15 10"/>
                        </svg>
                        <span>Your payment is secure and encrypted.</span>
                    </div>
                </div>
            </div>

        </section>

        <!-- Bottom Centered Pay Link -->
        <div class="pay-btn-wrap">
            <a href="task-posted.html" class="pay-btn">Pay &#8377;430</a>
        </div>

    </main>

</body>
</html>
