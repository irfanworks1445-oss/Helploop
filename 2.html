<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpLoop - Create an Account</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>

    <div class="signup-wrapper">
        
        <!-- Left Column: Brand + Google Button -->
        <div class="left-column">
            <img src="Group 654.png" alt="HelpLoop - People, Tools, Tasks" class="logo-image">

            <p class="subtitle">
                A Stronger Neighbourhood<br>
                Start Here
            </p>

            <a href="home.html" class="google-btn">
                <img src="icons8-google-48.png" alt="Google" class="google-icon">
                <span>Continue Using Google</span>
            </a>
        </div>

        <!-- Right Column: Sign Up Form -->
        <div class="right-column">
            <h2 class="form-title">Create an Account</h2>

            <form action="home.html" method="GET" class="signup-form">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <input type="password" placeholder="Confirm Password" required>

                <a href="home.html" class="signup-btn">SignUp</a>
            </form>

            <p class="login-text">
                Already have an account? <a href="3.html" class="login-link">Login</a>
            </p>
        </div>

    </div>

</body>
</html>
